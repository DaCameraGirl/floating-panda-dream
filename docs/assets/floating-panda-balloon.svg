<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Floating chubby panda with two red balloons</title>
  <desc id="desc">A smiling, round panda floats through a bright dream sky while holding two sparkly red helium balloons.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#14256d"/>
      <stop offset="0.48" stop-color="#5a55b8"/>
      <stop offset="1" stop-color="#ff8fc7"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="64%" cy="27%" r="42%">
      <stop offset="0" stop-color="#fff7a9" stop-opacity="0.95"/>
      <stop offset="0.34" stop-color="#8bf4ff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#8bf4ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="balloonRed" cx="38%" cy="30%" r="72%">
      <stop offset="0" stop-color="#ff8a8a"/>
      <stop offset="0.45" stop-color="#ff3b46"/>
      <stop offset="1" stop-color="#c20f24"/>
    </radialGradient>
    <filter id="softGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="720" height="360" rx="28" fill="url(#sky)"/>
  <rect width="720" height="360" rx="28" fill="url(#moonGlow)"/>

  <g opacity="0.62" fill="#ffffff">
    <circle cx="62" cy="69" r="2.5"/>
    <circle cx="122" cy="126" r="1.8"/>
    <circle cx="196" cy="62" r="2.2"/>
    <circle cx="284" cy="100" r="1.7"/>
    <circle cx="592" cy="81" r="2.5"/>
    <circle cx="642" cy="152" r="1.9"/>
    <circle cx="523" cy="220" r="2"/>
  </g>

  <g opacity="0.28" fill="#fff6c8">
    <ellipse cx="134" cy="272" rx="116" ry="21"/>
    <ellipse cx="606" cy="294" rx="128" ry="24"/>
    <ellipse cx="431" cy="315" rx="92" ry="17"/>
  </g>

  <path d="M-12 118 C112 50 214 193 342 115 C470 37 573 153 732 76" fill="none" stroke="#8bf4ff" stroke-width="5" stroke-linecap="round" opacity="0.26"/>
  <path d="M-20 175 C120 238 203 88 353 163 C514 244 577 109 741 169" fill="none" stroke="#fff36b" stroke-width="4" stroke-linecap="round" opacity="0.22"/>

  <g filter="url(#softGlow)">
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -12; 0 0" dur="4.8s" repeatCount="indefinite"/>

    <!-- balloon strings -->
    <path d="M152 110 C156 138 172 128 185 120" fill="none" stroke="#fff7d6" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
    <path d="M368 104 C366 134 356 130 350 120" fill="none" stroke="#fff7d6" stroke-width="3" stroke-linecap="round" opacity="0.85"/>

    <!-- red balloon A -->
    <ellipse cx="152" cy="66" rx="38" ry="44" fill="url(#balloonRed)"/>
    <path d="M145 108 L152 122 L159 108Z" fill="#c20f24"/>
    <ellipse cx="139" cy="50" rx="10" ry="15" fill="#ffd9d9" opacity="0.7"/>
    <path transform="translate(170 52) scale(0.95)" d="M0 -7 C1.4 -1.4 1.4 -1.4 7 0 C1.4 1.4 1.4 1.4 0 7 C-1.4 1.4 -1.4 1.4 -7 0 C-1.4 -1.4 -1.4 -1.4 0 -7Z" fill="#ffffff" opacity="0.95"/>
    <path transform="translate(140 82) scale(0.6)" d="M0 -7 C1.4 -1.4 1.4 -1.4 7 0 C1.4 1.4 1.4 1.4 0 7 C-1.4 1.4 -1.4 1.4 -7 0 C-1.4 -1.4 -1.4 -1.4 0 -7Z" fill="#ffffff" opacity="0.9"/>

    <!-- red balloon B -->
    <ellipse cx="368" cy="60" rx="38" ry="44" fill="url(#balloonRed)"/>
    <path d="M361 102 L368 116 L375 102Z" fill="#c20f24"/>
    <ellipse cx="355" cy="44" rx="10" ry="15" fill="#ffd9d9" opacity="0.7"/>
    <path transform="translate(386 46) scale(0.95)" d="M0 -7 C1.4 -1.4 1.4 -1.4 7 0 C1.4 1.4 1.4 1.4 0 7 C-1.4 1.4 -1.4 1.4 -7 0 C-1.4 -1.4 -1.4 -1.4 0 -7Z" fill="#ffffff" opacity="0.95"/>
    <path transform="translate(356 76) scale(0.6)" d="M0 -7 C1.4 -1.4 1.4 -1.4 7 0 C1.4 1.4 1.4 1.4 0 7 C-1.4 1.4 -1.4 1.4 -7 0 C-1.4 -1.4 -1.4 -1.4 0 -7Z" fill="#ffffff" opacity="0.9"/>

    <!-- chubby floating panda -->
    <g transform="translate(267 219)">
      <ellipse cx="0" cy="138" rx="94" ry="19" fill="#101326" opacity="0.24"/>

      <!-- raised arms holding the strings -->
      <path d="M-55 -6 C-86 -34 -92 -70 -82 -99" fill="none" stroke="#202026" stroke-width="22" stroke-linecap="round"/>
      <path d="M55 -6 C86 -34 92 -70 83 -99" fill="none" stroke="#202026" stroke-width="22" stroke-linecap="round"/>

      <!-- fat body -->
      <ellipse cx="0" cy="40" rx="90" ry="78" fill="#f8f8ef"/>
      <ellipse cx="0" cy="50" rx="58" ry="60" fill="#ffffff" opacity="0.55"/>

      <!-- feet -->
      <ellipse cx="-42" cy="112" rx="30" ry="22" fill="#202026"/>
      <ellipse cx="42" cy="112" rx="30" ry="22" fill="#202026"/>
      <circle cx="-42" cy="112" r="9" fill="#ff9fc8" opacity="0.6"/>
      <circle cx="42" cy="112" r="9" fill="#ff9fc8" opacity="0.6"/>

      <!-- paws gripping the strings -->
      <circle cx="-82" cy="-101" r="14" fill="#202026"/>
      <circle cx="83" cy="-101" r="14" fill="#202026"/>

      <!-- ears -->
      <circle cx="-54" cy="-112" r="29" fill="#202026"/>
      <circle cx="54" cy="-112" r="29" fill="#202026"/>
      <circle cx="-54" cy="-110" r="13" fill="#ff9fc8" opacity="0.55"/>
      <circle cx="54" cy="-110" r="13" fill="#ff9fc8" opacity="0.55"/>

      <!-- head -->
      <ellipse cx="0" cy="-66" rx="82" ry="70" fill="#f8f8ef"/>
      <ellipse cx="-31" cy="-76" rx="22" ry="29" transform="rotate(-20 -31 -76)" fill="#202026"/>
      <ellipse cx="31" cy="-76" rx="22" ry="29" transform="rotate(20 31 -76)" fill="#202026"/>
      <circle cx="-31" cy="-81" r="7" fill="#ffffff"/>
      <circle cx="31" cy="-81" r="7" fill="#ffffff"/>
      <circle cx="-28" cy="-80" r="3.5" fill="#222"/>
      <circle cx="34" cy="-80" r="3.5" fill="#222"/>
      <ellipse cx="0" cy="-49" rx="15" ry="11" fill="#202026"/>
      <path d="M-20 -26 C-8 -10 8 -10 20 -26" fill="none" stroke="#202026" stroke-width="7" stroke-linecap="round"/>
      <circle cx="-54" cy="-44" r="10" fill="#ff9fc8" opacity="0.65"/>
      <circle cx="54" cy="-44" r="10" fill="#ff9fc8" opacity="0.65"/>
    </g>

    <circle cx="505" cy="263" r="9" fill="#fff36b"/>
    <circle cx="526" cy="245" r="5" fill="#8bf4ff"/>
    <circle cx="156" cy="150" r="6" fill="#58ffc5"/>
    <path d="M150 231 L167 221 L184 231 L167 241Z" fill="#fff36b"/>
  </g>
</svg>
