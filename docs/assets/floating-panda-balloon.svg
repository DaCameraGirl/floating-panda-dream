<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Floating panda with a helium balloon</title>
  <desc id="desc">A smiling panda floats through a bright dream sky while holding a heart-shaped helium balloon.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#14256d"/>
      <stop offset="0.48" stop-color="#5a55b8"/>
      <stop offset="1" stop-color="#ff8fc7"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="64%" cy="27%" r="42%">
      <stop offset="0" stop-color="#fff7a9" stop-opacity="0.95"/>
      <stop offset="0.34" stop-color="#8bf4ff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#8bf4ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="720" height="360" rx="28" fill="url(#sky)"/>
  <rect width="720" height="360" rx="28" fill="url(#moonGlow)"/>

  <g opacity="0.62" fill="#ffffff">
