<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Floating Panda Dream</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#101225;color:#fff8ef;font-family:"Segoe UI",Verdana,system-ui,sans-serif;touch-action:none;user-select:none}#game{position:fixed;inset:0;width:100vw;height:100vh;display:block;background:#151832}.hud{position:fixed;left:14px;right:14px;top:12px;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:10px;pointer-events:none}.brand{font-weight:900;letter-spacing:.04em;text-shadow:0 2px 12px rgba(0,0,0,.55)}.stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.pill{border:1px solid rgba(255,255,255,.2);border-radius:999px;background:rgba(12,15,30,.62);backdrop-filter:blur(8px);padding:8px 11px;font-size:13px;font-weight:800}.energy{width:130px;height:10px;border:1px solid rgba(255,255,255,.25);border-radius:999px;overflow:hidden;background:rgba(0,0,0,.25);margin-top:3px}.energy span{display:block;height:100%;width:100%;background:linear-gradient(90deg,#6ff0bd,#ffd166,#ff7b74)}.overlay{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:radial-gradient(circle at 50% 42%,rgba(29,35,86,.62),rgba(6,8,18,.92));padding:24px;text-align:center}.overlay.hidden{display:none}.title{font-size:clamp(46px,10vw,112px);font-weight:950;line-height:.9;letter-spacing:0;text-shadow:0 10px 40px rgba(0,0,0,.45)}.sub{max-width:560px;margin:18px auto 0;color:#dce2ff;font-size:clamp(15px,2.5vw,20px);line-height:1.45}.start{margin-top:28px;border:0;border-radius:999px;padding:15px 28px;background:linear-gradient(90deg,#ffd166,#9be7ff,#ff9ac2);color:#17111a;font-weight:950;font-size:18px;cursor:pointer;box-shadow:0 16px 44px rgba(0,0,0,.3)}.start:hover{transform:translateY(-1px)}.touch{position:fixed;left:14px;right:14px;bottom:14px;z-index:4;display:none;justify-content:space-between;pointer-events:none}.pad,.dash{pointer-events:auto}.pad{display:grid;grid-template-columns:48px 48px 48px;grid-template-rows:48px 48px 48px;gap:6px}.pad button,.dash{border:1px solid rgba(255,255,255,.18);border-radius:12px;background:rgba(14,17,35,.62);color:#fff;font-weight:950;font-size:18px;backdrop-filter:blur(8px)}.pad button:nth-child(1){grid-column:2}.pad button:nth-child(2){grid-column:1;grid-row:2}.pad button:nth-child(3){grid-column:2;grid-row:2}.pad button:nth-child(4){grid-column:3;grid-row:2}.pad button:nth-child(5){grid-column:2;grid-row:3}.dash{align-self:end;width:82px;height:82px;border-radius:50%;font-size:14px}@media(pointer:coarse){.touch{display:flex}.pill{font-size:12px;padding:7px 9px}.brand{font-size:14px}.energy{width:92px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud"><div><div class="brand">FLOATING PANDA DREAM</div><div class="energy"><span id="energyBar"></span></div></div><div class="stats"><div class="pill">Score <span id="score">0</span></div><div class="pill">Streak <span id="streak">0</span></div><div class="pill">Time <span id="time">75</span></div></div></div>
<div id="overlay" class="overlay"><div><div class="title">Floating Panda Dream</div><p class="sub">Float through the sky lane, collect moon candy, thread lantern rings, and dodge ghost clouds before the dream fades.</p><button id="start" class="start">Start game</button></div></div>
<div class="touch"><div class="pad"><button data-k="ArrowUp">U</button><button data-k="ArrowLeft">L</button><button data-k="stop">.</button><button data-k="ArrowRight">R</button><button data-k="ArrowDown">D</button></div><button class="dash" data-k="Space">DASH</button></div>
<script>
(()=>{
'use strict';
const cv=document.getElementById('game'),ctx=cv.getContext('2d');
const scoreEl=document.getElementById('score'),streakEl=document.getElementById('streak'),timeEl=document.getElementById('time'),energyBar=document.getElementById('energyBar'),overlay=document.getElementById('overlay');
let W=0,H=0,DPR=1,last=0,running=false,over=false,spawnT=0,ringT=0,cloudT=0,timeLeft=75,score=0,streak=0,shake=0;
const keys=new Set(),items=[],rings=[],clouds=[],stars=[];
const player={x:160,y:220,vx:0,vy:0,r:28,energy:100,dash:0,inv:0};
const rand=(a,b)=>a+Math.random()*(b-a); const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=Math.floor(W*DPR);cv.height=Math.floor(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);if(!stars.length){for(let i=0;i<90;i++)stars.push({x:rand(0,W),y:rand(0,H),r:rand(.5,2),s:rand(8,32),a:rand(.15,.7)})}}
function reset(){items.length=0;rings.length=0;clouds.length=0;score=0;streak=0;timeLeft=75;spawnT=0;ringT=1;cloudT=2;shake=0;over=false;player.x=Math.max(110,W*.16);player.y=H*.48;player.vx=0;player.vy=0;player.energy=100;player.dash=0;player.inv=0;running=true;overlay.classList.add('hidden');updateHud()}
function updateHud(){scoreEl.textContent=score;streakEl.textContent=streak;timeEl.textContent=Math.max(0,Math.ceil(timeLeft));energyBar.style.width=clamp(player.energy,0,100)+'%'}
function spawnCandy(){items.push({x:W+30,y:rand(80,H-90),r:12,t:0})}
function spawnRing(){rings.push({x:W+70,y:rand(110,H-120),r:36,w:8,hit:false,t:0})}
function spawnCloud(){clouds.push({x:W+80,y:rand(85,H-95),r:rand(28,44),vx:rand(130,190),t:0})}
function hit(a,b,rr){const dx=a.x-b.x,dy=a.y-b.y;return dx*dx+dy*dy<rr*rr}
function update(dt){if(!running)return;timeLeft-=dt;if(timeLeft<=0||player.energy<=0){running=false;over=true;overlay.querySelector('.title').textContent='Dream Over';overlay.querySelector('.sub').textContent='Score '+score+' with a best streak of '+streak+'. Start again and chase a cleaner flight.';overlay.querySelector('.start').textContent='Restart';overlay.classList.remove('hidden');return}
let ax=0,ay=0;if(keys.has('ArrowLeft')||keys.has('a'))ax-=1;if(keys.has('ArrowRight')||keys.has('d'))ax+=1;if(keys.has('ArrowUp')||keys.has('w'))ay-=1;if(keys.has('ArrowDown')||keys.has('s'))ay+=1;if(keys.has(' ')){if(player.dash<=0){player.dash=.38;player.vx+=(ax||1)*420;player.vy+=ay*320;player.energy=Math.max(0,player.energy-4)}keys.delete(' ')}
const thrust=720*(player.dash>0?1.2:1);player.vx+=ax*thrust*dt;player.vy+=ay*thrust*dt;player.vy+=42*dt;player.vx*=Math.pow(.08,dt);player.vy*=Math.pow(.11,dt);player.x=clamp(player.x+player.vx*dt,42,W-42);player.y=clamp(player.y+player.vy*dt,68,H-44);player.dash=Math.max(0,player.dash-dt);player.inv=Math.max(0,player.inv-dt);player.energy=clamp(player.energy+dt*3.2,0,100);
spawnT-=dt;ringT-=dt;cloudT-=dt;if(spawnT<=0){spawnCandy();spawnT=rand(.45,.85)}if(ringT<=0){spawnRing();ringT=rand(2.2,3.4)}if(cloudT<=0){spawnCloud();cloudT=rand(1.45,2.2)}
for(const s of stars){s.x-=s.s*dt;if(s.x<-8){s.x=W+8;s.y=rand(0,H)}}
for(let i=items.length-1;i>=0;i--){const it=items[i];it.x-=210*dt;it.t+=dt;if(hit(player,it,player.r+it.r)){score+=10+streak*2;player.energy=clamp(player.energy+4,0,100);items.splice(i,1);continue}if(it.x<-40)items.splice(i,1)}
for(let i=rings.length-1;i>=0;i--){const r=rings[i];r.x-=185*dt;r.t+=dt;const d=Math.hypot(player.x-r.x,player.y-r.y);if(!r.hit&&d<r.r&&d>r.r-r.w-22){r.hit=true;streak++;score+=25*streak;player.energy=clamp(player.energy+8,0,100)}if(r.x<-90)rings.splice(i,1)}
for(let i=clouds.length-1;i>=0;i--){const c=clouds[i];c.x-=c.vx*dt;c.t+=dt;if(player.inv<=0&&hit(player,c,player.r+c.r*.85)){player.energy-=18;streak=0;player.inv=1.1;shake=.25;clouds.splice(i,1);continue}if(c.x<-90)clouds.splice(i,1)}shake=Math.max(0,shake-dt);updateHud()}
function drawSky(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#171a3f');g.addColorStop(.52,'#28346c');g.addColorStop(1,'#40284b');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.save();ctx.globalCompositeOperation='lighter';let moon=ctx.createRadialGradient(W*.82,H*.18,0,W*.82,H*.18,120);moon.addColorStop(0,'rgba(255,232,165,.72)');moon.addColorStop(1,'rgba(255,232,165,0)');ctx.fillStyle=moon;ctx.beginPath();ctx.arc(W*.82,H*.18,120,0,Math.PI*2);ctx.fill();ctx.restore();for(const s of stars){ctx.globalAlpha=s.a;ctx.fillStyle='#fff7d1';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;ctx.fillStyle='rgba(255,255,255,.08)';for(let i=0;i<7;i++){const y=H*.72+Math.sin(i+Date.now()/4000)*18;ctx.beginPath();ctx.ellipse((i*230-Date.now()/45)% (W+260)-120,y,130,24,0,0,Math.PI*2);ctx.fill()}}
function drawCandy(o){ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.t*3);ctx.fillStyle='#ffd166';ctx.strokeStyle='rgba(255,255,255,.75)';ctx.lineWidth=2;ctx.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4,rr=i%2?7:14;ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}ctx.closePath();ctx.fill();ctx.stroke();ctx.restore()}
function drawRing(r){ctx.save();ctx.translate(r.x,r.y);ctx.strokeStyle=r.hit?'#6ff0bd':'#ffcf6f';ctx.lineWidth=r.w;ctx.shadowColor=ctx.strokeStyle;ctx.shadowBlur=18;ctx.beginPath();ctx.arc(0,0,r.r,0,Math.PI*2);ctx.stroke();ctx.restore()}
function drawCloud(c){ctx.save();ctx.translate(c.x,c.y);ctx.globalAlpha=.9;ctx.fillStyle='#cbc8ff';ctx.shadowColor='rgba(180,170,255,.5)';ctx.shadowBlur=18;for(const p of [[0,0,1],[-22,6,.72],[23,8,.82],[-4,-18,.76]]){ctx.beginPath();ctx.arc(p[0],p[1],c.r*p[2],0,Math.PI*2);ctx.fill()}ctx.fillStyle='rgba(65,50,96,.7)';ctx.beginPath();ctx.arc(-12,4,4,0,Math.PI*2);ctx.arc(12,4,4,0,Math.PI*2);ctx.fill();ctx.strokeStyle='rgba(65,50,96,.8)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,15,10,Math.PI*.15,Math.PI*.85);ctx.stroke();ctx.restore()}
function drawPanda(){ctx.save();ctx.translate(player.x,player.y);if(player.inv>0)ctx.globalAlpha=.45+.35*Math.sin(Date.now()/45);ctx.rotate(player.vx*.0009);const flap=Math.sin(Date.now()/120)*5;ctx.fillStyle='rgba(0,0,0,.22)';ctx.beginPath();ctx.ellipse(0,34,36,9,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f7f7f0';ctx.beginPath();ctx.arc(0,0,27,0,Math.PI*2);ctx.fill();ctx.fillStyle='#202026';ctx.beginPath();ctx.arc(-22,-19,11,0,Math.PI*2);ctx.arc(22,-19,11,0,Math.PI*2);ctx.fill();ctx.fillStyle='#202026';ctx.beginPath();ctx.ellipse(-10,-4,8,10,-.35,0,Math.PI*2);ctx.ellipse(10,-4,8,10,.35,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f7f7f0';ctx.beginPath();ctx.arc(-10,-5,3,0,Math.PI*2);ctx.arc(10,-5,3,0,Math.PI*2);ctx.fill();ctx.fillStyle='#202026';ctx.beginPath();ctx.arc(0,8,5,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#202026';ctx.lineWidth=3;ctx.lineCap='round';ctx.beginPath();ctx.arc(0,14,10,.15*Math.PI,.85*Math.PI);ctx.stroke();ctx.strokeStyle='#202026';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(-19,18);ctx.lineTo(-38,24+flap);ctx.moveTo(19,18);ctx.lineTo(38,24-flap);ctx.stroke();ctx.restore()}
function render(){ctx.save();if(shake>0)ctx.translate(rand(-6,6)*shake*4,rand(-4,4)*shake*4);drawSky();for(const r of rings)drawRing(r);for(const it of items)drawCandy(it);for(const c of clouds)drawCloud(c);drawPanda();ctx.restore()}
function loop(t){const dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);render();requestAnimationFrame(loop)}
addEventListener('resize',resize);addEventListener('keydown',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','w','a','s','d'].includes(k)){e.preventDefault();keys.add(k)}});addEventListener('keyup',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;keys.delete(k)});
document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();if(k==='stop'){keys.clear();return}keys.add(k==='Space'?' ':k)});b.addEventListener('pointerup',()=>keys.delete(k==='Space'?' ':k));b.addEventListener('pointercancel',()=>keys.delete(k==='Space'?' ':k))});
document.getElementById('start').onclick=()=>reset();resize();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
