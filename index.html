<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Floating Panda Dream</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="theme-color" content="#7fd0ff" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Panda Dream" />
<link rel="stylesheet" href="styles.css">
</head>
<body>
<canvas id="game"></canvas>
<div class="hud">
  <div>
    <div class="brand">FLOATING PANDA DREAM</div>
    <div class="energy"><span id="energyBar"></span></div>
  </div>
  <div class="stats">
    <div class="pill">Score <span id="score">0</span></div>
    <div class="pill">Streak <span id="streak">0</span></div>
    <div class="pill">Time <span id="time">75</span></div>
    <div class="pill">Hit <span id="hitName">ready</span></div>
  </div>
</div>
<div id="overlay" class="overlay">
  <div>
    <div class="title">Floating Panda Dream</div>
    <p class="sub">Float through the neon sky lane, grab glowing treats, thread lantern rings, and pop sleepy hazards with sparkly darts before the dream timer fades.</p>
    <button id="start" class="start">Start game</button>
  </div>
</div>
<div class="touch">
  <div class="pad">
    <button data-k="ArrowUp">U</button>
    <button data-k="ArrowLeft">L</button>
    <button data-k="stop">.</button>
    <button data-k="ArrowRight">R</button>
    <button data-k="ArrowDown">D</button>
  </div>
  <div class="actions">
    <button class="fire" data-k="f">FIRE</button>
    <button class="dash" data-k="Space">DASH</button>
  </div>
</div>
<script src="game.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
</body>
</html>
