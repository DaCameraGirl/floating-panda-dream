<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Floating Panda Dream</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#101225;color:#fff8ef;font-family:"Segoe UI",Verdana,system-ui,sans-serif;touch-action:none;user-select:none}#game{position:fixed;inset:0;width:100vw;height:100vh;display:block;background:#151832}.hud{position:fixed;left:14px;right:14px;top:12px;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:10px;pointer-events:none}.brand{font-weight:900;letter-spacing:.04em;text-shadow:0 2px 12px rgba(0,0,0,.55)}.stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.pill{border:1px solid rgba(255,255,255,.2);border-radius:999px;background:rgba(12,15,30,.62);backdrop-filter:blur(8px);padding:8px 11px;font-size:13px;font-weight:800}.energy{width:130px;height:10px;border:1px solid rgba(255,255,255,.25);border-radius:999px;overflow:hidden;background:rgba(0,0,0,.25);margin-top:3px}.energy span{display:block;height:100%;width:100%;background:linear-gradient(90deg,#6ff0bd,#ffd166,#ff7b74)}.overlay{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:radial-gradient(circle at 50% 42%,rgba(29,35,86,.62),rgba(6,8,18,.92));padding:24px;text-align:center}.overlay.hidden{display:none}.title{font-size:clamp(46px,10vw,112px);font-weight:950;line-height:.9;letter-spacing:0;text-shadow:0 10px 40px rgba(0,0,0,.45)}.sub{max-width:620px;margin:18px auto 0;color:#dce2ff;font-size:clamp(15px,2.5vw,20px);line-height:1.45}.start{margin-top:28px;border:0;border-radius:999px;padding:15px 28px;background:linear-gradient(90deg,#ffd166,#9be7ff,#ff9ac2);color:#17111a;font-weight:950;font-size:18px;cursor:pointer;box-shadow:0 16px 44px rgba(0,0,0,.3)}.start:hover{transform:translateY(-1px)}.touch{position:fixed;left:14px;right:14px;bottom:14px;z-index:4;display:none;justify-content:space-between;pointer-events:none}.pad,.dash{pointer-events:auto}.pad{display:grid;grid-template-columns:48px 48px 48px;grid-template-rows:48px 48px 48px;gap:6px}.pad button,.dash{border:1px solid rgba(255,255,255,.18);border-radius:12px;background:rgba(14,17,35,.62);color:#fff;font-weight:950;font-size:18px;backdrop-filter:blur(8px)}.pad button:nth-child(1){grid-column:2}.pad button:nth-child(2){grid-column:1;grid-row:2}.pad button:nth-child(3){grid-column:2;grid-row:2}.pad button:nth-child(4){grid-column:3;grid-row:2}.pad button:nth-child(5){grid-column:2;grid-row:3}.dash{align-self:end;width:82px;height:82px;border-radius:50%;font-size:14px}@media(pointer:coarse){.touch{display:flex}.pill{font-size:12px;padding:7px 9px}.brand{font-size:14px}.energy{width:92px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud"><div><div class="brand">FLOATING PANDA DREAM</div><div class="energy"><span id="energyBar"></span></div></div><div class="stats"><div class="pill">Score <span id="score">0</span></div><div class="pill">Streak <span id="streak">0</span></div><div class="pill">Time <span id="time">75</span></div><div class="pill">Hit <span id="hitName">ready</span></div></div></div>
<div id="overlay" class="overlay"><div><div class="title">Floating Panda Dream</div><p class="sub">Float through the sky lane. Hit moon candy, star fruit, dream bubbles, time charms, and lantern rings. Dodge storm bolts, sleepy pillows, and ghost clouds.</p><button id="start" class="start">Start game</button></div></div>
<div class="touch"><div class="pad"><button data-k="ArrowUp">U</button><button data-k="ArrowLeft">L</button><button data-k="stop">.</button><button data-k="ArrowRight">R</button><button data-k="ArrowDown">D</button></div><button class="dash" data-k="Space">DASH</button></div>
<script>
(()=>{
'use strict';
const cv=document.getElementById('game'),ctx=cv.getContext('2d');
const scoreEl=document.getElementById('score'),streakEl=document.getElementById('streak'),timeEl=document.getElementById('time'),hitEl=document.getElementById('hitName'),energyBar=document.getElementById('energyBar'),overlay=document.getElementById('overlay');
let W=0,H=0,DPR=1,last=0,running=false,spawnT=0,ringT=0,hazardT=0,bonusT=0,timeLeft=75,score=0,streak=0,bestStreak=0,shake=0,flash=0;
const keys=new Set(),objects=[],rings=[],stars=[],bursts=[];
const player={x:160,y:220,vx:0,vy:0,r:28,energy:100,dash:0,inv:0,slow:0};
const TYPES={
 candy:{name:'moon candy',r:12,speed:210,score:10,energy:4,color:'#ffd166',kind:'good'},
 star:{name:'star fruit',r:15,speed:235,score:24,energy:2,color:'#fff27a',kind:'good'},
 bubble:{name:'dream bubble',r:18,speed:165,score:12,energy:18,color:'#9be7ff',kind:'good'},
 clock:{name:'time charm',r:16,speed:190,score:8,time:7,color:'#c7ff7a',kind:'good'},
 feather:{name:'dash feather',r:14,speed:245,score:16,energy:9,color:'#ff9ac2',kind:'good'},
 bolt:{name:'storm bolt',r:18,speed:280,damage:13,color:'#ffe066',kind:'bad'},
 pillow:{name:'sleepy pillow',r:20,speed:175,damage:8,slow:1.3,color:'#d9c7ff',kind:'bad'},
 cloud:{name:'ghost cloud',r:34,speed:155,damage:18,color:'#cbc8ff',kind:'bad'}
};
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>v<a?a:v>b?b:v,pick=a=>a[(Math.random()*a.length)|0];
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=Math.floor(W*DPR);cv.height=Math.floor(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);if(!stars.length){for(let i=0;i<110;i++)stars.push({x:rand(0,W),y:rand(0,H),r:rand(.5,2),s:rand(8,36),a:rand(.15,.72)})}}
function reset(){objects.length=0;rings.length=0;bursts.length=0;score=0;streak=0;bestStreak=0;timeLeft=75;spawnT=0;ringT=1;hazardT=1.4;bonusT=2.2;shake=0;flash=0;hitEl.textContent='ready';player.x=Math.max(110,W*.16);player.y=H*.48;player.vx=0;player.vy=0;player.energy=100;player.dash=0;player.inv=0;player.slow=0;running=true;overlay.classList.add('hidden');updateHud()}
function updateHud(){scoreEl.textContent=score;streakEl.textContent=streak;timeEl.textContent=Math.max(0,Math.ceil(timeLeft));energyBar.style.width=clamp(player.energy,0,100)+'%'}
function spawnObject(type){const d=TYPES[type];objects.push({type,x:W+rand(30,95),y:rand(78,H-84),r:d.r,t:0,vx:d.speed*rand(.9,1.18),bob:rand(0,Math.PI*2)})}
function spawnRing(){rings.push({x:W+70,y:rand(110,H-120),r:38,w:8,hit:false,t:0})}
function burst(x,y,color,n=14){for(let i=0;i<n;i++){const a=rand(0,Math.PI*2),sp=rand(60,230);bursts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,color,r:rand(2,5)})}}
function hit(a,b,rr){const dx=a.x-b.x,dy=a.y-b.y;return dx*dx+dy*dy<rr*rr}
function label(name){hitEl.textContent=name;clearTimeout(label.t);label.t=setTimeout(()=>{hitEl.textContent=running?'flying':'done'},900)}
function collect(o,d){score+=d.score+streak*2;player.energy=clamp(player.energy+(d.energy||0),0,100);if(d.time)timeLeft+=d.time;if(o.type==='bubble')player.inv=Math.max(player.inv,1.8);if(o.type==='feather')player.dash=Math.max(player.dash,.52);label(d.name);burst(o.x,o.y,d.color,18)}
function hurt(o,d){player.energy-=d.damage;player.inv=1.05;player.slow=Math.max(player.slow,d.slow||0);player.vx-=160;player.vy+=rand(-120,120);streak=0;shake=.28;flash=.35;label(d.name);burst(o.x,o.y,d.color,22)}
function update(dt){if(!running)return;timeLeft-=dt;if(timeLeft<=0||player.energy<=0){running=false;overlay.querySelector('.title').textContent='Dream Over';overlay.querySelector('.sub').textContent='Score '+score+' with a best streak of '+bestStreak+'. Hit more good objects and dodge the bad ones next run.';overlay.querySelector('.start').textContent='Restart';overlay.classList.remove('hidden');return}
let ax=0,ay=0;if(keys.has('ArrowLeft')||keys.has('a'))ax-=1;if(keys.has('ArrowRight')||keys.has('d'))ax+=1;if(keys.has('ArrowUp')||keys.has('w'))ay-=1;if(keys.has('ArrowDown')||keys.has('s'))ay+=1;if(keys.has(' ')){if(player.dash<=0){player.dash=.38;player.vx+=(ax||1)*440;player.vy+=ay*330;player.energy=Math.max(0,player.energy-4)}keys.delete(' ')}
const slowMul=player.slow>0?.62:1,thrust=760*(player.dash>0?1.22:1)*slowMul;player.vx+=ax*thrust*dt;player.vy+=ay*thrust*dt;player.vy+=42*dt;player.vx*=Math.pow(.08,dt);player.vy*=Math.pow(.11,dt);player.x=clamp(player.x+player.vx*dt,42,W-42);player.y=clamp(player.y+player.vy*dt,68,H-44);player.dash=Math.max(0,player.dash-dt);player.inv=Math.max(0,player.inv-dt);player.slow=Math.max(0,player.slow-dt);player.energy=clamp(player.energy+dt*3.2,0,100);
spawnT-=dt;ringT-=dt;hazardT-=dt;bonusT-=dt;if(spawnT<=0){spawnObject(pick(['candy','candy','star','feather']));spawnT=rand(.38,.72)}if(bonusT<=0){spawnObject(pick(['bubble','clock','star']));bonusT=rand(2.5,4.2)}if(ringT<=0){spawnRing();ringT=rand(2.1,3.2)}if(hazardT<=0){spawnObject(pick(['cloud','cloud','bolt','pillow']));hazardT=rand(1.05,1.75)}
for(const s of stars){s.x-=s.s*dt;if(s.x<-8){s.x=W+8;s.y=rand(0,H)}}
for(let i=objects.length-1;i>=0;i--){const o=objects[i],d=TYPES[o.type];o.x-=o.vx*dt;o.t+=dt;o.y+=Math.sin(o.t*2+o.bob)*10*dt;if(hit(player,o,player.r+o.r)){if(d.kind==='good')collect(o,d);else if(player.inv<=0)hurt(o,d);objects.splice(i,1);continue}if(o.x<-80)objects.splice(i,1)}
for(let i=rings.length-1;i>=0;i--){const r=rings[i];r.x-=185*dt;r.t+=dt;const d=Math.hypot(player.x-r.x,player.y-r.y);if(!r.hit&&d<r.r&&d>r.r-r.w-22){r.hit=true;streak++;bestStreak=Math.max(bestStreak,streak);score+=25*streak;player.energy=clamp(player.energy+8,0,100);label('lantern ring');burst(r.x,r.y,'#ffcf6f',24)}if(r.x<-90)rings.splice(i,1)}
for(let i=bursts.length-1;i>=0;i--){const p=bursts[i];p.life-=dt*1.7;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=90*dt;if(p.life<=0)bursts.splice(i,1)}shake=Math.max(0,shake-dt);flash=Math.max(0,flash-dt);updateHud()}
function drawSky(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#171a3f');g.addColorStop(.52,'#28346c');g.addColorStop(1,'#40284b');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.save();ctx.globalCompositeOperation='lighter';let moon=ctx.createRadialGradient(W*.82,H*.18,0,W*.82,H*.18,120);moon.addColorStop(0,'rgba(255,232,165,.72)');moon.addColorStop(1,'rgba(255,232,165,0)');ctx.fillStyle=moon;ctx.beginPath();ctx.arc(W*.82,H*.18,120,0,Math.PI*2);ctx.fill();ctx.restore();for(const s of stars){ctx.globalAlpha=s.a;ctx.fillStyle='#fff7d1';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;ctx.fillStyle='rgba(255,255,255,.08)';for(let i=0;i<7;i++){const y=H*.72+Math.sin(i+Date.now()/4000)*18;ctx.beginPath();ctx.ellipse((i*230-Date.now()/45)%(W+260)-120,y,130,24,0,0,Math.PI*2);ctx.fill()}}
function drawStarShape(x,y,r,color,spin=0){ctx.save();ctx.translate(x,y);ctx.rotate(spin);ctx.fillStyle=color;ctx.strokeStyle='rgba(255,255,255,.75)';ctx.lineWidth=2;ctx.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,rr=i%2?r*.45:r;ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}ctx.closePath();ctx.fill();ctx.stroke();ctx.restore()}
function drawObject(o){const d=TYPES[o.type];ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.t*(o.type==='bolt'?.5:1.8));ctx.shadowColor=d.color;ctx.shadowBlur=16;if(o.type==='candy')drawStarShape(0,0,14,d.color,o.t*2);else if(o.type==='star')drawStarShape(0,0,18,d.color,o.t*2);else if(o.type==='bubble'){ctx.globalAlpha=.75;ctx.strokeStyle=d.color;ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,0,18,0,Math.PI*2);ctx.stroke();ctx.fillStyle='rgba(155,231,255,.16)';ctx.fill()}else if(o.type==='clock'){ctx.fillStyle='#c7ff7a';ctx.beginPath();ctx.arc(0,0,16,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#1f2b16';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-9);ctx.moveTo(0,0);ctx.lineTo(8,3);ctx.stroke()}else if(o.type==='feather'){ctx.fillStyle=d.color;ctx.beginPath();ctx.ellipse(0,0,8,20,.65,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-7,14);ctx.lineTo(8,-15);ctx.stroke()}else if(o.type==='bolt'){ctx.fillStyle=d.color;ctx.beginPath();ctx.moveTo(-6,-22);ctx.lineTo(12,-4);ctx.lineTo(2,-3);ctx.lineTo(8,22);ctx.lineTo(-12,1);ctx.lineTo(-1,0);ctx.closePath();ctx.fill()}else if(o.type==='pillow'){ctx.fillStyle=d.color;ctx.beginPath();ctx.roundRect(-22,-14,44,28,9);ctx.fill();ctx.strokeStyle='rgba(85,65,140,.8)';ctx.stroke()}else if(o.type==='cloud'){ctx.globalAlpha=.92;ctx.fillStyle=d.color;for(const p of [[0,0,1],[-22,6,.72],[23,8,.82],[-4,-18,.76]]){ctx.beginPath();ctx.arc(p[0],p[1],34*p[2],0,Math.PI*2);ctx.fill()}ctx.fillStyle='rgba(65,50,96,.75)';ctx.beginPath();ctx.arc(-12,4,4,0,Math.PI*2);ctx.arc(12,4,4,0,Math.PI*2);ctx.fill();ctx.strokeStyle='rgba(65,50,96,.85)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,15,10,Math.PI*.15,Math.PI*.85);ctx.stroke()}ctx.restore()}
function drawRing(r){ctx.save();ctx.translate(r.x,r.y);ctx.strokeStyle=r.hit?'#6ff0bd':'#ffcf6f';ctx.lineWidth=r.w;ctx.shadowColor=ctx.strokeStyle;ctx.shadowBlur=18;ctx.beginPath();ctx.arc(0,0,r.r,0,Math.PI*2);ctx.stroke();ctx.restore()}
function drawPanda(){ctx.save();ctx.translate(player.x,player.y);if(player.inv>0)ctx.globalAlpha=.45+.35*Math.sin(Date.now()/45);ctx.rotate(player.vx*.0009);const flap=Math.sin(Date.now()/120)*5;if(player.dash>0){ctx.globalCompositeOperation='lighter';ctx.fillStyle='rgba(155,231,255,.24)';ctx.beginPath();ctx.ellipse(-28,0,50,18,0,0,Math.PI*2);ctx.fill();ctx.globalCompositeOperation='source-over'}ctx.fillStyle='rgba(0,0,0,.22)';ctx.beginPath();ctx.ellipse(0,34,36,9,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f7f7f0';ctx.beginPath();ctx.arc(0,0,27,0,Math.PI*2);ctx.fill();ctx.fillStyle='#202026';ctx.beginPath();ctx.arc(-22,-19,11,0,Math.PI*2);ctx.arc(22,-19,11,0,Math.PI*2);ctx.fill();ctx.fillStyle='#202026';ctx.beginPath();ctx.ellipse(-10,-4,8,10,-.35,0,Math.PI*2);ctx.ellipse(10,-4,8,10,.35,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f7f7f0';ctx.beginPath();ctx.arc(-10,-5,3,0,Math.PI*2);ctx.arc(10,-5,3,0,Math.PI*2);ctx.fill();ctx.fillStyle='#202026';ctx.beginPath();ctx.arc(0,8,5,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#202026';ctx.lineWidth=3;ctx.lineCap='round';ctx.beginPath();ctx.arc(0,14,10,.15*Math.PI,.85*Math.PI);ctx.stroke();ctx.strokeStyle='#202026';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(-19,18);ctx.lineTo(-38,24+flap);ctx.moveTo(19,18);ctx.lineTo(38,24-flap);ctx.stroke();ctx.restore()}
function drawBursts(){ctx.save();ctx.globalCompositeOperation='lighter';for(const p of bursts){ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}ctx.restore();ctx.globalAlpha=1}
function render(){ctx.save();if(shake>0)ctx.translate(rand(-6,6)*shake*4,rand(-4,4)*shake*4);drawSky();for(const r of rings)drawRing(r);for(const o of objects)drawObject(o);drawBursts();drawPanda();if(flash>0){ctx.fillStyle='rgba(255,110,90,'+(flash*.32)+')';ctx.fillRect(0,0,W,H)}ctx.restore()}
function loop(t){const dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);render();requestAnimationFrame(loop)}
addEventListener('resize',resize);addEventListener('keydown',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','w','a','s','d'].includes(k)){e.preventDefault();keys.add(k)}});addEventListener('keyup',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;keys.delete(k)});
document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();if(k==='stop'){keys.clear();return}keys.add(k==='Space'?' ':k)});b.addEventListener('pointerup',()=>keys.delete(k==='Space'?' ':k));b.addEventListener('pointercancel',()=>keys.delete(k==='Space'?' ':k))});
document.getElementById('start').onclick=()=>reset();resize();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
